name: Install
description: Sets up mise (Node + pnpm) and installs frozen dependencies

runs:
  using: composite
  steps:
    - name: Setup mise
      uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
      with:
        cache: true

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
