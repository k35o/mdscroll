name: Install
description: Sets up mise (Node + pnpm) and installs frozen dependencies

runs:
  using: composite
  steps:
    - name: Setup mise
      uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
      with:
        cache: true

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
