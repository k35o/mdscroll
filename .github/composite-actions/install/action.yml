name: Install
description: Sets up mise (Node + pnpm) and installs frozen dependencies

runs:
  using: composite
  steps:
    - name: Setup mise
      uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
      with:
        cache: true

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
