name: Install
description: Sets up mise (Node + pnpm) and installs frozen dependencies

runs:
  using: composite
  steps:
    - name: Setup mise
      uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
      with:
        cache: true

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
