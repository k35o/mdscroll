name: Install
description: Sets up mise (Node + pnpm) and installs frozen dependencies

runs:
  using: composite
  steps:
    - name: Setup mise
      uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
      with:
        cache: true

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
